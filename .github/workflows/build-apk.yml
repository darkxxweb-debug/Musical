name: Jenga APK (MusicStream)

# Inaendeshwa kila 'push' kwenye main, au ukibonyeza "Run workflow" mwenyewe
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Chukua code (checkout)
        uses: actions/checkout@v4

      - name: Weka Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Weka Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Tunajenga na wakati huo huo tunahifadhi log yote kwenye build_log.txt
      # continue-on-error: true -> ili step zinazofuata ziweze kuangalia matokeo
      # (imefanikiwa au imeshindwa) badala ya workflow kusimama papo hapo.
      - name: Jenga APK
        id: gradle_build
        run: gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt
        continue-on-error: true

      # ============ IKIWA IMESHINDWA (ERROR) ============
      - name: Onyesha muhtasari wa ERROR kwenye ukurasa wa Summary
        if: steps.gradle_build.outcome == 'failure'
        run: |
          echo "## ❌ Ujenzi (build) umeshindwa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Hapa chini ni sehemu za error zilizopatikana kwenye log:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -i -E "error|exception|FAILED|what went wrong" -A 6 build_log.txt | tail -n 150 >> $GITHUB_STEP_SUMMARY || echo "(Angalia faili la log kikamilifu kwenye artifact)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 Log kamili ipo kwenye artifact **build-error-log** hapo chini kwenye ukurasa huu." >> $GITHUB_STEP_SUMMARY

      # Tunapakia (upload) LOG PEKEE - sio APK - endapo kumetokea error,
      # ili iwe rahisi kujua tatizo lilipo bila kuchanganya na faili nyingine.
      - name: Pakia error log pekee (kama imeshindwa)
        if: steps.gradle_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: |
            build_log.txt
            **/build/reports/**
          retention-days: 14

      - name: Simamisha workflow kwa alama nyekundu (failed)
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      # ============ IKIWA IMEFANIKIWA ============
      - name: Onyesha ujumbe wa mafanikio
        if: steps.gradle_build.outcome == 'success'
        run: echo "## ✅ Ujenzi umefanikiwa - APK iko tayari hapo chini" >> $GITHUB_STEP_SUMMARY

      # Tunatafuta APK popote ilipo kwenye repo (badala ya path moja tu maalum),
      # kisha tunaandika njia halisi kwenye Summary - hii inasaidia endapo siku
      # fulani muundo wa folder utabadilika (mf. project ikiwa ndani ya subfolder).
      - name: Tafuta APK ilipo (uchunguzi)
        if: steps.gradle_build.outcome == 'success'
        id: find_apk
        run: |
          echo "### 🔎 APK zilizopatikana:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -path "*/outputs/apk/*" -name "*.apk" | tee found_apks.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ ! -s found_apks.txt ]; then
            echo "⚠️ Hakuna faili la .apk lililopatikana popote. Angalia log ya 'Jenga APK' hapo juu." >> $GITHUB_STEP_SUMMARY
          fi

      # Tunapakia APK PEKEE endapo build imefanikiwa - glob ya "**" inatafuta
      # kwenye ngazi zote za folder, si njia moja tu maalum
      - name: Pakia APK (kama imefanikiwa)
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
